name: Native Superset verification
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: roles/apache_superset
      - run: pip install 'ansible==8.7.0'
      - name: Install and verify login, persistence and backup restoration
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: ansible-playbook -b roles/apache_superset/tests/test.yml -e apache_superset_test_restart=true -e apache_superset_test_backup=true
      - name: Check application idempotence
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: |
          set -o pipefail
          ansible-playbook -b roles/apache_superset/tests/test.yml | tee /tmp/idempotence.log
          grep -Eq 'changed=0[[:space:]]+unreachable=0[[:space:]]+failed=0' /tmp/idempotence.log
      - name: Diagnostics
        if: failure()
        run: sudo journalctl -u apache-superset -u postgresql@14-superset --no-pager -n 100
